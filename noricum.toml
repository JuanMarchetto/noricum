# Noricum default configuration

[llm]
# Primary provider for migration tasks
primary_provider = "anthropic"

[llm.anthropic]
# Model selection by task complexity
# Hard tasks use Opus, Medium uses Sonnet, Easy uses Haiku
hard_model = "claude-opus-4-6"
medium_model = "claude-sonnet-4-6"
easy_model = "claude-3-5-haiku-latest"

[llm.deepseek]
# Model selection by task complexity
# Hard tasks use Reasoner (R1), Medium/Easy use Chat (V3)
hard_model = "deepseek-reasoner"
medium_model = "deepseek-chat"
easy_model = "deepseek-chat"

[llm.temperature]
# Defaults used if not set
# analysis = 0.2
# translation = 0.3
# repair_base = 0.4
# test_gen = 0.3

[llm.budget]
# Maximum total token budget per run (input + output). Set to 0 for unlimited.
max_tokens = 500000
# Maximum LLM API calls per run. Set to 0 for unlimited.
max_llm_calls = 20

[migration]
# Maximum repair iterations before fallback to unsafe
max_repair_iterations = 5
# Minimum idiomatic score to accept (0-100)
min_idiomatic_score = 60
# Allow unsafe blocks in final output as fallback
allow_unsafe_fallback = true
# Maximum C source file size in bytes (5 MB)
max_source_size = 5242880

[validation]
# Run differential tests comparing C and Rust output
differential_testing = true
# Run clippy on generated code
clippy_check = true
# Compiler flags for C compilation
c_compiler = "cc"
c_flags = ["-std=c11", "-Wall"]

[output]
# Where to write migrated Rust code
output_dir = "output"
# Generate a migration report
generate_report = true
