[workspace]
members = [
    "crates/noricum-cli",
    "crates/noricum-core",
    "crates/noricum-ir",
    "crates/noricum-agents",
    "crates/noricum-tools",
    "crates/noricum-validation",
    "crates/noricum-mcp",
]
resolver = "2"

[package]
name = "noricum-workspace-tests"
version = "0.1.0"
edition = "2024"
publish = false

[dev-dependencies]
noricum-tools = { path = "crates/noricum-tools" }
tempfile = { workspace = true }
serde_json = { workspace = true }

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Juan Patricio Marchetto <juanmarchetto@users.noreply.github.com>"]
repository = "https://github.com/JuanMarchetto/noricum"

[workspace.dependencies]
# Internal crates
noricum-core = { path = "crates/noricum-core" }
noricum-ir = { path = "crates/noricum-ir" }
noricum-agents = { path = "crates/noricum-agents" }
noricum-tools = { path = "crates/noricum-tools" }
noricum-validation = { path = "crates/noricum-validation" }

# CLI
clap = { version = "4", features = ["derive"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# LLM framework
rig-core = { version = "0.31", features = ["derive"] }

# Regex
regex = "1"

# Error handling
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Tree-sitter for code analysis
tree-sitter = "0.25"
tree-sitter-c = "0.23"
tree-sitter-rust = "0.23"

# Testing
tempfile = "3"
